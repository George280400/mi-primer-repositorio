<div class="container">
  <div class="row mb-3">
    <div class="col-12 text-end">
      <button 
        type="button" 
        class="btn btn-success" 
        [routerLink]="['/guardarE']"
      >
        <i class="bi bi-plus-circle"></i> Nuevo Empleado
      </button>
    </div>
  </div>
  
  <div class="card">
    <div class="card-header">Lista de Empleados</div>
    <div class="card-body">
      <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
          <tr>
            <th scope="col">ID EMPLEADO</th>
            <th scope="col">NOMBRE</th>
            <th scope="col">APELLIDO</th>
            <th scope="col">TELÉFONO</th>
            <th scope="col">PUESTO</th>
            <th scope="col">OPERACIONES</th>
          </tr>
        </thead>
        <tbody>
          @for (empleado of empleados; track empleado.idEmpleado) {
            <tr>
              <td>{{empleado.idEmpleado}}</td>
              <td>{{empleado.nombre}}</td>
              <td>{{empleado.apellido}}</td>
              <td>{{empleado.telefono}}</td>
              <td>{{empleado.puesto}}</td>
              <td>
                <div class="btn-group" role="group">
                  <button type="button" class="btn btn-danger" (click)="eliminarButton(empleado.idEmpleado)">ELIMINAR</button>
                  <button type="button" class="btn btn-warning" (click)="editarButton(empleado)">EDITAR</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6" style="text-align: center;">
                No existen registros
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
