<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>Editar Cliente</h2>
        </div>
        <div class="card-body">
            <p>Ingresa los datos del nuevo cliente</p>
            <form>
               
                <!--
                <div class="form-group mb-3">
                    <label for="idCliente" class="form-label">ID Cliente</label>
                    <input 
                        type="number" 
                        class="form-control" 
                        name="idCliente" 
                        placeholder="Ej: 1" 
                        [(ngModel)]="cliente.idCliente" disabled>
                </div>
                -->

                <!-- Nombre -->
                <div class="form-group mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        name="nombre" 
                        placeholder="Ej: Juan" 
                        [(ngModel)]="cliente.nombre">
                </div>

                <!-- Apellido Paterno -->
                <div class="form-group mb-3">
                    <label for="app" class="form-label">Apellido Paterno</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        name="app" 
                        placeholder="Ej: Pérez" 
                        [(ngModel)]="cliente.app">
                </div>

                <!-- Apellido Materno -->
                <div class="form-group mb-3">
                    <label for="apm" class="form-label">Apellido Materno</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        name="apm" 
                        placeholder="Ej: López" 
                        [(ngModel)]="cliente.apm">
                </div>

                <!-- Teléfono -->
                <div class="form-group mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        name="telefono" 
                        placeholder="Ej: 555-123-4567" 
                        [(ngModel)]="cliente.telefono">
                </div>

                <div>
                    <button type="button" class="btn btn-success" (click)="editarCliente()">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>
</div>
