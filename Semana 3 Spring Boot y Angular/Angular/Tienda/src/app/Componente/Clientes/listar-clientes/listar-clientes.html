<div class="container">
  <div class="row mb-3">
    <div class="col-12 text-end">
      <button 
        type="button" 
        class="btn btn-success" 
        [routerLink]="['/guardarCl']"
      >
        <i class="bi bi-plus-circle"></i> Nuevo Cliente
      </button>
    </div>
  </div>
  
  <div class="card">
    <div class="card-header">Lista de Clientes</div>
    <div class="card-body">
      <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
          <tr>
            <th scope="col">ID CLIENTE</th>
            <th scope="col">NOMBRE</th>
            <th scope="col">APELLIDO PATERNO</th>
            <th scope="col">APELLIDO MATERNO</th>
            <th scope="col">TELÉFONO</th>
            <th scope="col">OPERACIONES</th>
          </tr>
        </thead>
        <tbody>
          @for (cliente of clientes; track cliente.idCliente) {
            <tr>
              <td>{{cliente.idCliente}}</td>
              <td>{{cliente.nombre}}</td>
              <td>{{cliente.app}}</td>
              <td>{{cliente.apm}}</td>
              <td>{{cliente.telefono}}</td>
              <td>
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button type="button" class="btn btn-danger" (click)="eliminarButton(cliente.idCliente)">ELIMINAR</button>
                  <button type="button" class="btn btn-warning" (click)="editarButton(cliente)">EDITAR</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6" style="text-align: center;">
                No existen registros
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
