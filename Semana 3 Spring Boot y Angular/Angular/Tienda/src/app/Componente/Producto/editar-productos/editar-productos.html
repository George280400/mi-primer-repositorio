
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>Nuevo Producto</h2>
        </div>
        <div class="card-body">
            <p>Ingresa los datos del nuevo producto</p>
            <form>
                <!-- Código de barras -->
                <div class="form-group mb-3">
                    <label for="codigoBarras" class="form-label">Código de Barras</label>
                    <input type="number" class="form-control" name="codigoBarras" placeholder="Ej: 123456789" [(ngModel)]="producto.codigoBarras">
                </div>

                <!-- Nombre -->
                <div class="form-group mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="nombre" placeholder="Ej: Juguete, Carro" [(ngModel)]="producto.nombre">
                </div>

                <!-- Precio -->
                <div class="form-group mb-3">
                    <label for="precio" class="form-label">Precio</label>
                    <input type="number" class="form-control" name="precio" placeholder="Ej: 1200" [(ngModel)]="producto.precio">
                </div>

                <!-- Stock -->
                <div class="form-group mb-3">
                    <label for="stock" class="form-label">Stock</label>
                    <input type="number" class="form-control" name="stock" placeholder="Ej: 50" [(ngModel)]="producto.stock">
                </div>

                <!-- Descuento -->
                <div class="form-group mb-3">
                    <label for="descuento" class="form-label">Descuento (%)</label>
                    <input type="number" class="form-control" name="descuento" placeholder="Ej: 10" [(ngModel)]="producto.descuento">
                </div>

                <!-- Categoría -->
                <div class="form-group mb-3">
                    <label for="categoriaId" class="form-label">Categoría</label>
                    <input type="number" class="form-control" name="categoriaId" placeholder="Ej: 1" [(ngModel)]="producto.categoriaId">
                </div>

                <!-- Proveedor -->
                <div class="form-group mb-3">
                    <label for="proveedorId" class="form-label">Proveedor</label>
                    <input type="number" class="form-control" name="proveedorId" placeholder="Ej: 1" [(ngModel)]="producto.proveedorId">
                </div>

                <div>
                    <button type="button" class="btn btn-success" (click)="editarProducto()">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>
</div>
