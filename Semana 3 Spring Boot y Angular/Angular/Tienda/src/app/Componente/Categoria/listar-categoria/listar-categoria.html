<div class="container">
  <div class="row mb-3">
    <div class="col-12 text-end">
      <button 
        type="button" 
        class="btn btn-success" 
        [routerLink]="['/guardarC']"
      >
        <i class="bi bi-plus-circle"></i> Nueva Categoría
      </button>
    </div>
  </div>
  
  <div class="card">
    <div class="card-header">Lista de Categorías</div>
    <div class="card-body">
      <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
          <tr>
            <th scope="col">ID CATEGORÍA</th>
            <th scope="col">NOMBRE</th>
            <th scope="col">DESCRIPCIÓN</th>
            <th scope="col">OPERACIONES</th>
          </tr>
        </thead>
        <tbody>
          @for (categoria of categorias; track categoria.idCategoria) {
            <tr>
              <td>{{categoria.idCategoria}}</td>
              <td>{{categoria.nombre}}</td>
              <td>{{categoria.descripcion}}</td>
              <td>
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button type="button" class="btn btn-danger" (click)="eliminarButton(categoria.idCategoria)">ELIMINAR</button>
                  <button type="button" class="btn btn-warning" (click)="editarButton(categoria)">EDITAR</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" style="text-align: center;">
                No existen registros
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
