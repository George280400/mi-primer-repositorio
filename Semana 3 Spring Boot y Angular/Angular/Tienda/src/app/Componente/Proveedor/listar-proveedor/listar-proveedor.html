<div class="container">
  <div class="row mb-3">
    <div class="col-12 text-end">
      <button 
        type="button" 
        class="btn btn-success" 
        [routerLink]="['/guardarPR']"
      >
        <i class="bi bi-plus-circle"></i> Nuevo Proveedor
      </button>
    </div>
  </div>
  
  <div class="card">
    <div class="card-header">Lista de Proveedores</div>
    <div class="card-body">
      <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
          <tr>
            <th scope="col">ID PROVEEDOR</th>
            <th scope="col">NOMBRE</th>
            <th scope="col">TELÉFONO</th>
            <th scope="col">EMAIL</th>
            <th scope="col">OPERACIONES</th>
          </tr>
        </thead>
        <tbody>
          @for (proveedor of proveedores; track proveedor.idProveedor) {
            <tr>
              <td>{{proveedor.idProveedor}}</td>
              <td>{{proveedor.nombre}}</td>
              <td>{{proveedor.telefono}}</td>
              <td>{{proveedor.email}}</td>
              <td>
                <div class="btn-group" role="group">
                  <button type="button" class="btn btn-danger" (click)="eliminarButton(proveedor.idProveedor)">ELIMINAR</button>
                  <button type="button" class="btn btn-warning" (click)="editarButton(proveedor)">EDITAR</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" style="text-align: center;">
                No existen registros
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
