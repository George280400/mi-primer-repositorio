<div class="container">
    <div class="card">
        <div class="car-header">
            <h2>Nueva Computadora</h2>
        </div>
        <div class="card-body">
            <th>Ingresa los datos de la nueva computadora</th>
            <form>
                <!--ngModel es una directiva en Angular que proporciona un enlace Bidreccional entre elementos de un formulario HTML-->
                <div class=form-group>
                    <label for=idCompu class="form-label">ID COMPU</label>
                    <input type=number class="form-control" name="idCompu" placeholder="Eje : 1, 30, 2000" [(ngModel)]="compu.idCompu" disabled>
                </div>
                <!--MARCA-->
                <div class=form-group>
                    <label for=marca class="form-label">MARCA</label>
                    <input type=text class="form-control" name="marca" placeholder="Eje : Dell, Hp, Asus" [(ngModel)]="compu.marca">
                </div>

                <div class=form-group>
                    <label for=modelo class="form-label">MODELO</label>
                    <input type=text class="form-control" name="modelo" placeholder="Eje : Inspiron, ThinkPad" [(ngModel)]="compu.modelo">
                </div>

                <div class=form-group>
                    <label for=procesador class="form-label">PROCESADOR</label>
                    <input type=text class="form-control" name="procesador" placeholder="Eje : i7, AMD 3" [(ngModel)]="compu.procesador">
                </div>

                <div class=form-group>
                    <label for=ram class="form-label">RAM</label>
                    <input type=number class="form-control" name="ram" placeholder="Eje : 4, 8, 16" [(ngModel)]="compu.ram">
                </div>

                <div class=form-group>
                    <label for=capacidad class="form-label">CAPACIDAD</label>
                    <input type=text class="form-control" name="capacidad" placeholder="Eje : 256GB. 500GB" [(ngModel)]="compu.capacidad">
                </div>

                <div class=form-group>
                    <label for=color class="form-label">COLOR</label>
                    <input type=text class="form-control" name="color" placeholder="Eje : Negro, Rojo, Gris" [(ngModel)]="compu.color">
                </div>

                <div class=form-group>
                    <label for=precio class="form-label">PRECIO</label>
                    <input type=number class="form-control" name="precio" placeholder="Eje : 5500, 8000" [(ngModel)]="compu.precio">
                </div>
                <div>
                    <button type="button" class="btn btn-success" (click)="guardarC()">GUARDAR</button>
                </div>

            </form>
        </div>
    </div>
</div>
