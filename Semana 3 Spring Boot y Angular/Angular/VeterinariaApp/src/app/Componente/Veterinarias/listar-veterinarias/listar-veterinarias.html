<div class="container">
  <div class="row mb-3">
    <div class="col-12 text-end">
      <button 
        type="button" 
        class="btn btn-success" 
        [routerLink]="['/guardarV']"
      >
        <i class="bi bi-plus-circle"></i> Nueva Veterinaria
      </button>
    </div>
  </div>
  
  <div class="card">
    <div class="card-header">Lista de Veterinarias</div>
    <div class="card-body">
      <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
          <tr>
            <th scope="col">ID VETERINARIA</th>
            <th scope="col">NOMBRE</th>
            <th scope="col">DIRECCIÓN</th>
            <th scope="col">TELÉFONO</th>
            <th scope="col">OPERACIONES</th>
          </tr>
        </thead>
        <tbody>
          @for (veterinaria of veterinarias; track veterinaria.idVeterinaria) {
            <tr>
              <td>{{veterinaria.idVeterinaria}}</td>
              <td>{{veterinaria.nombre}}</td>
              <td>{{veterinaria.direccion}}</td>
              <td>{{veterinaria.telefono}}</td>
              <td>
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button type="button" class="btn btn-danger" (click)="eliminarButton(veterinaria.idVeterinaria)">ELIMINAR</button>
                  <button type="button" class="btn btn-warning" (click)="editarButton(veterinaria)">EDITAR</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" style="text-align: center;">
                No existen registros
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
