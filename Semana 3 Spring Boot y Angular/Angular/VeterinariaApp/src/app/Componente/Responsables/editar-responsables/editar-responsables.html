<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>Editar Responsable</h2>
        </div>
        <div class="card-body">
            <p>Ingresa los nuevos datos del responsable</p>
            <form>
                <!-- Nombre -->
                <div class="form-group mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        name="nombre" 
                        placeholder="Ej: Juan Pérez" 
                        [(ngModel)]="responsable.nombre">
                </div>

                <!-- Contacto -->
                <div class="form-group mb-3">
                    <label for="contacto" class="form-label">Contacto</label>
                    <input 
                        type="number" 
                        class="form-control" 
                        name="contacto" 
                        placeholder="Ej: 2221234567" 
                        [(ngModel)]="responsable.contacto">
                </div>

                <!-- Veterinaria -->
                <div class="form-group mb-3">
                    <label for="veterinariaId" class="form-label">Veterinaria</label>
                    <select 
                        class="form-select" 
                        name="veterinariaId" 
                        [(ngModel)]="responsable.veterinariaId">
                        <option *ngFor="let v of veterinarias" [value]="v.idVeterinaria">
                            {{v.idVeterinaria}} - {{v.nombre}}
                        </option>
                    </select>
                </div>

                <div>
                    <button type="button" class="btn btn-success" (click)="editarResponsable()">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>
</div>
