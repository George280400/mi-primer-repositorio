<div class="container">
  <div class="row mb-3">
    <div class="col-12 text-end">
      <button 
        type="button" 
        class="btn btn-success" 
        [routerLink]="['/guardarR']"
      >
        <i class="bi bi-plus-circle"></i> Nuevo Responsable
      </button>
    </div>
  </div>
  
  <div class="card">
    <div class="card-header">Lista de Responsables</div>
    <div class="card-body">
      <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
          <tr>
            <th scope="col">ID RESPONSABLE</th>
            <th scope="col">NOMBRE</th>
            <th scope="col">CONTACTO</th>
            <!-- <th scope="col">ID VETERINARIA</th> -->
            <th scope="col">NOMBRE VETERINARIA</th>
            <th scope="col">OPERACIONES</th>
          </tr>
        </thead>
        <tbody>
          @for (responsable of responsables; track responsable.idResponsable) {
            <tr>
              <td>{{responsable.idResponsable}}</td>
              <td>{{responsable.nombre}}</td>
              <td>{{responsable.contacto}}</td>
              <!-- <td>{{responsable.veterinariaId}}</td> -->
              <td>{{responsable.nombreVeterinaria}}</td>
              <td>
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button 
                    type="button" 
                    class="btn btn-danger" 
                    (click)="eliminarButton(responsable.idResponsable)"
                  >
                    ELIMINAR
                  </button>
                  <button 
                    type="button" 
                    class="btn btn-warning" 
                    (click)="editarButton(responsable)"
                  >
                    EDITAR
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" style="text-align: center;">
                No existen registros
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
