<div class="container">
  <div class="card">
    <div class="card-header">Roles</div>
    <div class="card-body">
      <table class="table table-dark">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">PRIVILEGIOS</th>
            <th scope="col">OPERACIONES</th>
          </tr>
        </thead>
        <tbody>
          @for (rol of roles; track rol.idRol) {
            <tr>
              <td>{{rol.idRol}}</td>
              <td>{{rol.privilegio}}</td>
              <td>
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button type="button" class="btn btn-danger" (click)="eliminarButton(rol.idRol)">ELIMINAR</button>
                  <button type="button" class="btn btn-warning" (click)="editarButton(rol)">EDITAR</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="9" style="text-align: center;">
                No existen registros
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
