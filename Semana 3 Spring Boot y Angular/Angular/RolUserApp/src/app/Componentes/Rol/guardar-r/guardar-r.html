<div class="container">
    <div class="card">
        <div class="car-header">
            <h2>Nuevo Rol</h2>
        </div>
        <div class="card-body">
            <th>Ingresa los datos del nuevo Rol</th>
            <form>
                <!--ngModel es una directiva en Angular que proporciona un enlace Bidreccional entre elementos de un formulario HTML-->
                <div class=form-group>
                    <label for=idRol class="form-label">ID ROL</label>
                    <input type=number class="form-control" name="idRol" placeholder="Eje : 1, 30, 2000" [(ngModel)]="rol.idRol" >
                </div>
                <div class=form-group>
                    <label for=privilegio class="form-label">PRIVILEGIO</label>
                    <input type=text class="form-control" name="privilegio" placeholder="Eje : Administrador" [(ngModel)]="rol.privilegio">
                </div>

                <div>
                    <button type="button" class="btn btn-success" (click)="guardarR()">GUARDAR</button>
                </div>

            </form>
        </div>
    </div>
</div>
