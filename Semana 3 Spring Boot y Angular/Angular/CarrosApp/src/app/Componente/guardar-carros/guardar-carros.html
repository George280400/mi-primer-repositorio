<div class="container">
    <div class="card">
        <div class="car-header">
            <h2>Nuevo Carro</h2>
        </div>
        <div class="card-body">
            <th>Ingresa los datos del nuevo carro</th>
            <form>
                <!--ngModel es una directiva en Angular que proporciona un enlace Bidreccional entre elementos de un formulario HTML-->
                
                <!--MARCA-->
                <div class=form-group>
                    <label for=marca class="form-label">MARCA</label>
                    <input type=text class="form-control" name="marca" placeholder="Eje : Volkswagen, Ford" [(ngModel)]="carro.marca">
                </div>

                <div class=form-group>
                    <label for=modelo class="form-label">MODELO</label>
                    <input type=text class="form-control" name="modelo" placeholder="Eje : Jetta, Spark" [(ngModel)]="carro.modelo">
                </div>

                <div class=form-group>
                    <label for=anio class="form-label">AÑO</label>
                    <input type=number class="form-control" name="anio" placeholder="Eje : 2022, 2025" [(ngModel)]="carro.anio">
                </div>

                <div class=form-group>
                    <label for=color class="form-label">COLOR</label>
                    <input type=text class="form-control" name="color" placeholder="Eje : Rojo, Azul" [(ngModel)]="carro.color">
                </div>

                <div class=form-group>
                    <label for=motor class="form-label">MOTOR</label>
                    <input type=text class="form-control" name="motor" placeholder="Eje : Gasolina, Diesel" [(ngModel)]="carro.motor">
                </div>

                <div class=form-group>
                    <label for=transmision class="form-label">TRANSMICION</label>
                    <input type=text class="form-control" name="transmision" placeholder="Eje : Standar, Automatico" [(ngModel)]="carro.transmision">
                </div>

                <div class=form-group>
                    <label for=precio class="form-label">PRECIO</label>
                    <input type=number class="form-control" name="precio" placeholder="Eje : 120000" [(ngModel)]="carro.precio">
                </div>
                <div>
                    <button type="button" class="btn btn-success" (click)="guardarC()">GUARDAR</button>
                </div>

            </form>
        </div>
    </div>
</div>
