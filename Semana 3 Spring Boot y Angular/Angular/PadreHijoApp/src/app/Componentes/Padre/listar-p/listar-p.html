<div class="container">
  <div class="card">
    <div class="card-header">Lista de Computadoras</div>
    <div class="card-body">
      <table class="table table-dark">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">NOMBRE</th>
            <th scope="col">APELLIDO</th>
            <th scope="col">EDAD</th>
            <th scope="col">TRABAJO</th>
            <th scope="col">OPERACIONES</th>
          </tr>
        </thead>
        <tbody>
          @for (padre of padres; track padre.idPadre) {
            <tr>
              <td>{{padre.idPadre}}</td>
              <td>{{padre.nombre}}</td>
              <td>{{padre.apellido}}</td>
              <td>{{padre.edad}}</td>
              <td>{{padre.trabajo}}</td>
              <td>
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button type="button" class="btn btn-danger" (click)="eliminarButton(padre.idPadre)">ELIMINAR</button>
                  <button type="button" class="btn btn-warning" (click)="editarButton(padre)">EDITAR</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="9" style="text-align: center;">
                No existen registros
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
