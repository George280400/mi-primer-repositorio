<div class="container">
    <div class="card">
        <div class="car-header">
            <h2>Nuevo Padre</h2>
        </div>
        <div class="card-body">
            <th>Ingresa los datos del nuevo Padre</th>
            <form>
                <!--ngModel es una directiva en Angular que proporciona un enlace Bidreccional entre elementos de un formulario HTML-->
                <div class=form-group>
                    <label for=idPadre class="form-label">ID PADRE</label>
                    <input type=number class="form-control" name="idPadre" placeholder="Eje : 1, 30, 2000" [(ngModel)]="padre.idPadre" >
                </div>
                <div class=form-group>
                    <label for=nombre class="form-label">NOMBRE</label>
                    <input type=text class="form-control" name="nombre" placeholder="Eje : Martin" [(ngModel)]="padre.nombre">
                </div>

                <div class=form-group>
                    <label for=apellido class="form-label">APELLIDO</label>
                    <input type=text class="form-control" name="apellido" placeholder="Eje : Contreras" [(ngModel)]="padre.apellido">
                </div>

                <div class=form-group>
                    <label for=edad class="form-label">EDAD</label>
                    <input type=number class="form-control" name="edad" placeholder="Eje : 45" [(ngModel)]="padre.edad">
                </div>

                <div class=form-group>
                    <label for=trabajo class="form-label">TRABAJO</label>
                    <input type=text class="form-control" name="trabajo" placeholder="Eje : Ing Civil" [(ngModel)]="padre.trabajo">
                </div>
                <div>
                    <button type="button" class="btn btn-success" (click)="guardarP()">GUARDAR</button>
                </div>

            </form>
        </div>
    </div>
</div>
