<html lang="es" xmlns="http://ww.thymeleaf.org">

<head>

	<meta charset="UTF-8">
	<title>PADRES</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		
		 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<div class="container">

		<div class="card">
			<div class="card-header">
				<h2>Lista de Padres</h2>
			</div>
			<div>
				<a class="btn btn-outline-dark" th:href="@{/nuevo}">Guardar</a>
			</div>
			<div class="card-body">
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>nombre</th>
							<th>apellido</th>
							<th>edad</th>
							<th>trabajo</th>
							<th>acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="padre : ${padres != null ? padres : lista}">
							<td th:text="${padre.idPadre}"></td>
							<td th:text="${padre.nombre}"></td>
							<td th:text="${padre.apellido}"></td>
							<td th:text="${padre.edad}"></td>
							<td th:text="${padre.trabajo}"></td>
							<td>
								<div class="btn-group" role="group" aria-label="Basic example">
									<a type="button" class="btn btn-primary" th:href="@{/abrirEditar/} + ${padre.idPadre}">Editar</a>
									<a type="button" class="btn btn-primary" th:href="@{/eliminar(idPadre=${padre.idPadre})}">Eliminar</a>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>

</html>
