<html lang="es" xmlns="http://ww.thymeleaf.org">

<head>

	<meta charset="UTF-8">
	<title>PADRES</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
	<div class="container">

		<div class="card">
			<div class="card-header">
				<h2>Lista de Hijos</h2>
			</div>
			<div>
				<a class="btn btn-outline-dark" th:href="@{/nuevoHijo}">Guardar</a>
			</div>
			<div class="card-body">
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>nombre</th>
							<th>apellido</th>
							<th>edad</th>
							<th>hobbie</th>
							<th>padre</th>
							<th>acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="hijo : ${hijo != null ? hijo : listaHijo}">
							<td th:text="${hijo.idHijo}"></td>
							<td th:text="${hijo.nombre}"></td>
							<td th:text="${hijo.apellido}"></td>
							<td th:text="${hijo.edad}"></td>
							<td th:text="${hijo.hobbie}"></td>
							<td th:text="${hijo.padreId?.nombre}"></td>
							<td>
								<div class="btn-group" role="group" aria-label="Basic example">
									<a type="button" class="btn btn-primary" th:href="@{/abrirEditarHijo/} + ${hijo.idHijo}">Editar</a>
									<a type="button" class="btn btn-primary" th:href="@{/eliminarHijo(idHijo=${hijo.idHijo})}">Eliminar</a>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>

</html>
