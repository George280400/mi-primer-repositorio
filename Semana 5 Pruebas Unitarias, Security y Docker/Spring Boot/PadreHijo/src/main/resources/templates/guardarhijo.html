<html lang="es" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guardar Hijo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">

    <div class="card">
        <div class="card-header">
            <h2>Guardar Hijo</h2>
        </div>
        <div>
            <a class="btn btn-outline-dark" th:href="@{/hijo}">Regresar a Hijos</a>
        </div>
        <div class="card-body">
            <form th:object="${hijo}" method="post" th:action="@{/guardarHijo}">
                <div>
                    <label for="idHijo">ID HIJO</label>
                    <input class="form-control" type="number" th:field="*{idHijo}" min="1">
                </div>
                <div>
                    <label for="nombre">NOMBRE</label>
                    <input class="form-control" type="text" th:field="*{nombre}">
                </div>
                <div>
                    <label for="apellido">APELLIDO</label>
                    <input class="form-control" type="text" th:field="*{apellido}">
                </div>
                <div>
                    <label for="edad">EDAD</label>
                    <input class="form-control" type="number" th:field="*{edad}" min="1">
                </div>
                <div>
                    <label for="hobbie">HOBBIE</label>
                    <input class="form-control" type="text" th:field="*{hobbie}">
                </div>
				<div>
				    <label for="padreId">PADRE</label>
				    <input class="form-control" type="number" th:field="*{padreId}" placeholder="ID del Padre">
				</div>
				<div><input class="btn btn-success" type="submit" , name="guardarHijo" value="GUARDAR"> </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
